<style>
:root{--bg:#F6FFB5;--g:#8EB075;--t:#3A0603;--c:#FFFDF4;--f:12px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;min-height:100%;color:var(--t);font:17px/1.55 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:linear-gradient(90deg,var(--g) 0 var(--f),transparent var(--f) calc(100% - var(--f)),var(--g) calc(100% - var(--f))) fixed,var(--bg)}
@media(min-width:900px){:root{--f:56px}}
main{max-width:960px;margin:0 auto;padding:16px calc(var(--f) + 16px) 48px;overflow-x:hidden}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.brand{font:700 26px Georgia,"Times New Roman",serif;display:flex;align-items:center;gap:8px}
.lang{display:flex;gap:6px}.lang button{min-width:48px;min-height:44px;border:2px solid var(--t);border-radius:12px;background:var(--c);color:var(--t);font:700 15px inherit;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--g)}
h1,h2{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:0 0 12px}h1{font-size:clamp(30px,6vw,46px)}h2{font-size:26px}
.card{background:var(--c);border:1px solid #cfe0bd;border-radius:22px;padding:24px;box-shadow:0 4px 18px rgba(58,6,3,.09);margin-bottom:18px}
.hero{text-align:center;padding:48px 24px}.sm{font-size:14px}
.btn{background:var(--g);color:var(--t);border:2px solid var(--t);border-radius:14px;padding:12px 22px;min-height:48px;font:700 16px inherit;cursor:pointer}
.btn.o{background:transparent}.btn.s{min-height:44px;padding:8px 14px}.btn:disabled{opacity:.5;cursor:not-allowed}
.row,.opts{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0}.nav{justify-content:space-between}
.row2{display:flex;gap:10px;margin:8px 0}.row2>*{flex:1}.row2 .btn{flex:none}
:focus-visible{outline:3px solid var(--t);outline-offset:3px}
fieldset{border:0;padding:0;margin:0 0 22px;min-width:0}legend,label.f{font-weight:700;display:block;margin-bottom:8px}label.f{margin:0 0 16px}
.opt{display:flex;align-items:center;gap:10px;border:2px solid #b9cfa4;border-radius:14px;padding:10px 16px;min-height:48px;background:#fff;cursor:pointer;font-weight:400}
.opt:has(input:checked){background:#e6f1d8;border-color:var(--t)}.opt input{width:20px;height:20px;accent-color:var(--t)}
input[type=text],select,textarea{width:100%;font:inherit;font-weight:400;padding:12px;margin-top:6px;border:2px solid var(--t);border-radius:12px;background:#fff;color:var(--t)}
.err{color:#8a1c12;font-weight:700;margin:6px 0}.note{background:#eef5e0;border-left:6px solid var(--g);padding:12px 16px;border-radius:10px;margin:12px 0}
.prog{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 18px}.prog li{flex:1;text-align:center;font-size:13px;border-top:6px solid #cfe0bd;padding-top:4px}.prog li.on{border-color:var(--t);font-weight:700}
.pv,video{display:block;max-width:100%;max-height:420px;border-radius:16px;margin:12px auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}.grid .card{margin:0}
.ph{height:110px;border-radius:14px;background:#eef5e0;border:2px dashed var(--g);display:grid;place-items:center;font-size:13px;margin-bottom:12px}
.tag{display:inline-block;background:var(--t);color:var(--bg);border-radius:8px;padding:2px 10px;font-size:12px;font-weight:700}.chip{display:inline-block;border:2px solid var(--g);border-radius:10px;padding:2px 10px;font-size:14px;font-weight:700;margin-bottom:8px}
.dbn{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--t);color:#fff;padding:10px 16px;border-radius:12px;margin-bottom:16px;font-weight:700}
dl{margin:0}dt{font-weight:700;margin-top:10px}dd{margin:0}.th{width:96px;height:96px;object-fit:cover;border-radius:14px;border:2px solid var(--g);display:block}.tl{display:flex;flex-wrap:wrap;gap:14px}.hero h1{font-style:italic;font-weight:400;font-family:"Palatino Linotype",Palatino,Georgia,serif}.hero h1:after{content:"";display:block;width:150px;height:12px;margin:14px auto 0;border-bottom:4px solid var(--g);border-radius:0 0 100% 100%}

const tx=(k,q)=>`<label class="f">${L(q)}<input type="text" data-k="${k}" value="${esc(A[k]||'')}" autocomplete="off"></label>`;
const fl=(k,q)=>`<div class="opts"><label class="opt"><input type="checkbox" data-f="${k}"${A[k]?' checked':''}><span>${L(q)}</span></label></div>`;
const nav=n=>`<div class="row nav"><button class="btn o" data-act="back">${L('back')}</button>${n===0?'':`<button class="btn" data-act="next">${L('next')}</button>`}</div>`;
const mkOn=()=>A.mk&&A.mk!=='no';
function prog(){return`<ol class="prog">${[0,1,2,3,4].map(i=>`<li class="${i===S.step?'on':''}"${i===S.step?' aria-current="step"':''}>${L('s'+i)}</li>`).join('')}</ol>`}
function pho(){let b;
if(S.cam==='live')b=`<video id="v" autoplay playsinline muted aria-label="${L('s1')}"></video><div class="row"><button class="btn" data-act="cap">${L('cap')}</button><button class="btn o" data-act="cc">${L('cancel')}</button></div>`;
else if(S.cam==='shot')b=`<img class="pv" src="${S.tmp}" alt="${L('prev')}"><div class="row"><button class="btn" data-act="use">${L('use')}</button><button class="btn o" data-act="cam">${L('retake')}</button></div>`;
else if(S.photo)b=`<img class="pv" src="${S.photo}" alt="${L('prev')}"><div class="row"><button class="btn o" data-act="pick">${L('rep')}</button><button class="btn o" data-act="cam">${L('take')}</button><button class="btn o" data-act="rm">${L('rm')}</button></div>`;
else b=`<div class="row"><button class="btn" data-act="pick">${L('pick')}</button><button class="btn" data-act="cam">${L('take')}</button></div>`;
return`<section class="card"><h2>${L('s1')}</h2><p>${L('ins')}</p>${b}${S.pe?`<p class="err" role="alert">⚠ ${L(S.pe)}</p>`:''}</section>`+nav()}
function pho2(){let b;const n=S.photos.length;
if(S.cam==='live')b=`<video id="v" autoplay playsinline muted aria-label="${L('s1')}"></video><div class="row"><button class="btn" data-act="cap">${L('cap')}</button><button class="btn o" data-act="cc">${L('cancel')}</button></div>`;
else if(S.cam==='shot')b=`<img class="pv" src="${S.tmp}" alt="${L('prev')}"><div class="row"><button class="btn" data-act="use">${L('use')}</button><button class="btn o" data-act="cam">${L('retake')}</button></div>`;
else b=`<div class="tl">${S.photos.map((p,i)=>`<figure style="margin:0"><img class="th" src="${p}" alt="${L('prev')} ${i+1}"><div class="row" style="margin:6px 0"><button class="btn o s" data-act="rep" data-i="${i}">${L('rep')}</button><button class="btn o s" data-act="rm" data-i="${i}">${L('rm')}</button></div></figure>`).join('')}</div><p class="sm">${n}/3${n>=3?' — '+L('e_max'):''}</p><div class="row"><button class="btn" data-act="pick"${n>=3?' disabled':''}>${L('pick')}</button><button class="btn" data-act="cam"${n>=3?' disabled':''}>${L('take')}</button></div>`;
return`<section class="card"><h2>${L('s1')}</h2><p>${L('ins')}</p>${b}${S.pe?`<p class="err" role="alert">⚠ ${L(S.pe)}</p>`:''}</section>`+nav()}
function qs(){let h='';const yn=['yes','no','occ'];
if(S.sub===0){const off=A.nocl||A.clunk;h=`<fieldset><legend>${L('q3')}</legend>${A.cl.map((v,i)=>`<div class="row2"><input type="text" aria-label="${L('brand')} ${i+1}" data-cl="${i}" value="${esc(v)}"${off?' disabled':''}>${A.cl.length>1?`<button class="btn o s" data-act="rmcl" data-i="${i}">${L('del')}</button>`:''}</div>`).join('')}<button class="btn o s" data-act="addcl"${off?' disabled':''}>${L('add')}</button>${fl('nocl','nocl')}${fl('clunk','clunk')}</fieldset>`;h+=rd('cream','q2',yn);if(A.cream==='yes'||A.cream==='occ')h+=tx('creamName','q2b')+fl('creamUnk','unk')}
if(S.sub===1){h=rd('mk','q4',['ev','occ','no']);
if(mkOn()){h+=rd('fd','q4b',['yes','no']);if(A.fd==='yes')h+=tx('fdName','q4c')+tx('fdShade','shade')}
h+=rd('tn','q5',yn);if(A.tn==='yes'||A.tn==='occ'){h+=tx('tnName','q5b');if(mkOn())h+=rd('tnBefore','q5c',['yes','no','som'])}
h+=`<fieldset><legend>${L('q5d')}</legend>${A.o.map((x,i)=>`<div class="row2"><select aria-label="${L('cat')}" data-oc="${i}">${['sun','ser','msk','exf','ot'].map(c=>`<option value="${c}"${x.c===c?' selected':''}>${L(c)}</option>`).join('')}</select><input type="text" aria-label="${L('brand')}" data-on="${i}" value="${esc(x.n)}">${A.o.length>1?`<button class="btn o s" data-act="rmo" data-i="${i}">${L('del')}</button>`:''}</div>`).join('')}<button class="btn o s" data-act="addo">${L('add')}</button></fieldset>`+rd('rt','q6',['dly','few','occ','none'])}
if(S.sub===2){h=rd('pim','q7',['pimp','blk','both','neither','unsure']);
if(A.pim==='pimp'||A.pim==='both')h+=mc('pt','q7b',['red','wht','dis','deep','unsure'])+rd('pw','q7c',['worse','scars','both','pn','dk']);
h+=`<fieldset><legend><label for="ex">${L('q8')}</label></legend><p class="sm" id="exh">${L('q8h')}</p><textarea id="ex" rows="5" data-k="extra" aria-describedby="exh">${esc(A.extra||'')}</textarea></fieldset>`}
return`<section class="card"><h2>${L('p'+(S.sub+1))} <span class="sm">(${S.sub+1}/3)</span></h2>${h}</section>`+nav()}
function review(){const o=v=>v?L(v):'—',j=a=>a.filter(Boolean).map(esc).join(', ')||'—',m=mkOn();
const ot=A.o.filter(x=>x.n).map(x=>L(x.c)+': '+esc(x.n)).join(', ');
const r=[['q3',A.nocl?L('nocl'):A.clunk?L('clunk'):j(A.cl)],['q2',o(A.cream)+((A.cream==='yes'||A.cream==='occ')&&A.creamName?' ('+esc(A.creamName)+')':'')],
['q4',o(A.mk)+(m&&A.fd?'; '+L('q4b')+' '+o(A.fd):'')+(m&&A.fd==='yes'&&A.fdName?' — '+esc(A.fdName):'')+(m&&A.fd==='yes'&&A.fdShade?', '+esc(A.fdShade):'')],
['q5',o(A.tn)+((A.tn==='yes'||A.tn==='occ')&&A.tnName?' ('+esc(A.tnName)+')':'')+(ot?'; '+ot:'')],['q6',o(A.rt)],['q7',o(A.pim)+(A.pt.length?': '+A.pt.map(v=>L(v)).join(', '):'')+(A.pw?'; '+o(A.pw):'')],['q8',A.extra?esc(A.extra):'—']];
return`<section class="card"><h2>${L('rev')}</h2><div class="row" style="justify-content:center">${S.photos.map((p,i)=>`<img class="th" src="${p}" alt="${L('prev')} ${i+1}">`).join('')}<button class="btn o s" data-act="ed" data-s="1">${L('ed')}</button></div>
<dl>${r.map(([q,v],i)=>`<dt>${L(q)}</dt><dd>${v}</dd>`).join('')}</dl><div class="row"><button class="btn o s" data-act="ed" data-s="2" data-u="0">${L('ed')} 1</button><button class="btn o s" data-act="ed" data-s="2" data-u="1">${L('ed')} 2</button><button class="btn o s" data-act="ed" data-s="2" data-u="2">${L('ed')} 3</button></div>
<label class="opt"><input type="checkbox" data-cs="1"${S.consent?' checked':''}><span>${L('cl')}</span></label>
<div class="row"><button class="btn" data-act="an"${S.consent?'':' disabled'}>${L('an')}</button></div>
${S.busy?`<div class="note" role="status">${L('busy')}</div>`:''}<div class="row"><button class="btn o s" data-act="wipe">${L('del_all')}</button></div></section>`+nav(0)}
function results2(){const rs=[];if(A.pt.includes('deep'))rs.push('r_deep');if(A.pw==='scars'||A.pw==='both')rs.push('r_scar');if(A.pw==='worse'||A.pw==='both')rs.push('r_worse');
const rep=[];if(A.pim)rep.push(L('q7')+' '+L(A.pim));if(A.pt.length)rep.push(A.pt.map(v=>L(v)).join(', '));if(A.pw)rep.push(L(A.pw));if(A.rt)rep.push(L('q6')+' '+L(A.rt));
return`<article class="card"><h2>${L('c1')}</h2><p><strong>${L('c1a')}</strong></p><dl><dt>${L('c1r')}</dt><dd>${rep.map(esc).join(' · ')||'—'}</dd></dl>${rs.length?`<div class="note"><strong>${L('derm')}</strong><br>${rs.map(r=>L(r)).join(' ')}</div>`:''}<p class="sm">${L('c1l')}</p></article><div class="row"><button class="btn o" data-act="dback">${L('dback')}</button><button class="btn o" data-act="wipe">${L('del_all')}</button></div><p class="sm">${L('delnote')}</p>`}
function results(){const rs=[];if(A.pt.includes('deep'))rs.push('r_deep');if(A.pw==='scars'||A.pw==='both')rs.push('r_scar');if(A.pw==='worse'||A.pw==='both')rs.push('r_worse');
const rep=[];if(A.pim)rep.push(L('q7')+' '+L(A.pim));if(A.pt.length)rep.push(A.pt.map(v=>L(v)).join(', '));if(A.pw)rep.push(L(A.pw));if(A.rt)rep.push(L('q6')+' '+L(A.rt));
const tag='',X=c=>({c2:mkOn()&&A.fd==='yes'&&A.fdName?L('x2'):'',c3:A.cream==='no'?L('x3'):A.cream?L('x3b'):'',c6:A.nocl?L('x6'):A.cl.some(v=>v)?L('x6b'):'',c7:A.tn==='yes'||A.tn==='occ'?L('x7'):'',c9:A.o.some(q=>q.c==='sun'&&q.n)?L('x9'):''}[c]||'');
const card=(c,tr,mk)=>mk&&S.hide?'':`<article class="card"><div class="ph" aria-hidden="true">${L('n_ver')}</div><h2>${L(c)} ${tag}</h2><span class="chip">${tr&&rs.length?L('n_wh'):tr?L('n_safe'):L('n_ver')}</span><p>${L(c+'t')}</p>${X(c)?`<p>${X(c)}</p>`:''}</article>`;
const mkc=['c2','c5'];
return`<div class="note" role="status"><strong>${L('gm')}</strong></div><section class="card"><h2>${L('pf')}</h2><div class="row2"><label class="f">${L('ctry')}<input type="text" data-p="ctry" value="${esc(S.pref.ctry)}"></label><label class="f">${L('bud')}<input type="text" data-p="bud" value="${esc(S.pref.bud)}"></label></div><p class="sm">${L('pfn')}</p><label class="opt"><input type="checkbox" data-hm="1"${S.hide?' checked':''}><span>${L('hmk')}</span></label></section>
<div class="grid"><article class="card"><h2>${L('c1')} ${tag}</h2><p><strong>${L('c1a')}</strong></p><dl><dt>${L('c1r')}</dt><dd>${rep.map(esc).join(' · ')||'—'}</dd></dl><p class="sm">${L('c1l')}</p></article>
${[['c2',0,1],['c3'],['c4',1,1],['c5',0,1],['c6'],['c7',1],['c8',1],['c9']].map(([c,t,m])=>card(c,c==='c4'||c==='c7'||c==='c8',mkc.includes(c))).join('')}
<article class="card"><h2>${L('c10')} ${tag}</h2>${rs.length?`<p><strong>${L('derm')}</strong></p><ul>${rs.map(r=>`<li>${L(r)}</li>`).join('')}</ul>`:`<p>${L('nor')}</p>`}<p class="sm">${L('inc')}</p><div class="note">${L('emg')}</div></article></div>
<div class="row"><button class="btn o" data-act="dback">${L('dback')}</button><button class="btn o" data-act="wipe">${L('del_all')}</button></div><p class="sm">${L('delnote')}</p>`}
let st=null;const stop=()=>{if(st){st.getTracks().forEach(t=>t.stop());st=null}};
function render(foc){document.documentElement.lang=S.lang;document.querySelectorAll('[data-l]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===S.lang));
const s=S.step;app.innerHTML=(s===0?`<section class="card hero"><h1>${L('h')}</h1><button class="btn" data-act="start">${L('go')}</button><p class="sm">${L('disc')}</p></section>`:prog()+(s===1?pho2():s===2?qs():s===3?review():results2()));
if(S.cam==='live'&&st)$('#v').srcObject=st;if(foc){scrollTo(0,0);const x=$('h1,h2');if(x){x.tabIndex=-1;x.focus()}}}
function rf(t){const q='input,select,textarea,button',i=[...app.querySelectorAll(q)].indexOf(t);render();if(i>=0){const n=app.querySelectorAll(q)[i];n&&n.focus()}}
function val(){const e=S.e={},r=k=>{if(!A[k])e[k]='req'};
if(S.sub===0)r('cream');
if(S.sub===1){r('mk');if(mkOn())r('fd');r('tn');r('rt')}
if(S.sub===2)r('pim');
render();const f=$('.err');if(f)f.scrollIntoView({block:'center'});return!Object.keys(e).length}
function wipe(){stop();Object.assign(S,{step:0,sub:0,photos:[],tmp:null,cam:false,pe:'',e:{},consent:false,busy:false,hide:false,rep:null,pref:{ctry:'',bud:''}});for(const k of Object.keys(A))delete A[k];Object.assign(A,{cl:[''],o:[{c:'sun',n:''}],pt:[]});render(1)}
async function cam(){S.pe='';stop();if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){S.pe='nocam';S.cam=false;return render()}
try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});S.cam='live'}catch(x){S.cam=false;S.pe=x&&x.name==='NotAllowedError'?'camdeny':'nocam'}render()}
app.addEventListener('input',e=>{const t=e.target,d=t.dataset;if(d.k)A[d.k]=t.value;else if(d.cl!=null)A.cl[d.cl]=t.value;else if(d.oc!=null)A.o[d.oc].c=t.value;else if(d.on!=null)A.o[d.on].n=t.value;else if(d.p)S.pref[d.p]=t.value});
app.addEventListener('change',e=>{const t=e.target,d=t.dataset;
if(t.type==='radio'){A[t.name]=t.value;delete S.e[t.name];rf(t)}
else if(d.f){A[d.f]=t.checked;if(t.checked){if(d.f==='noage')A.age='';if(d.f==='nocl'){A.cl=[''];A.clunk=false}if(d.f==='clunk'){A.cl=[''];A.nocl=false}}rf(t)}
else if(d.m){const a=A[d.m],v=t.value;A[d.m]=t.checked?(v==='unsure'?['unsure']:a.filter(x=>x!=='unsure').concat(v)):a.filter(x=>x!==v);rf(t)}
else if(d.hm){S.hide=t.checked;rf(t)}else if(d.cs){S.consent=t.checked;rf(t)}});
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,i=+b.dataset.i;let f=1;
if(a==='start'){S.step=1}
else if(a==='back'){stop();S.cam=false;if(S.step===2&&S.sub>0)S.sub--;else{S.step--;if(S.step===2)S.sub=2}}
else if(a==='next'){stop();S.cam=false;if(S.step===1){if(!S.photos.length){S.pe='e_need';return render()}S.step=2;S.sub=0}else{if(!val())return;if(S.sub<2)S.sub++;else S.step=3}}
else if(a==='pick'){S.rep=null;$('#f').multiple=true;$('#f').click();return}else if(a==='cam'){cam();return}
else if(a==='cap'){const v=$('#v');if(!v||!v.videoWidth)return;const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);S.tmp=c.toDataURL('image/jpeg',.9);stop();S.cam='shot';f=0}
else if(a==='cc'){stop();S.cam=false;f=0}else if(a==='use'){if(S.rep!=null)S.photos[S.rep]=S.tmp;else if(S.photos.length<3)S.photos.push(S.tmp);S.rep=null;S.cam=false;S.pe='';f=0}else if(a==='rm'){S.photos.splice(i,1);S.pe='';f=0}else if(a==='rep'){S.rep=i;$('#f').multiple=false;$('#f').click();return}else if(a==='wipe'){wipe();return}
else if(a==='addcl'){A.cl.push('');f=0}else if(a==='rmcl'){A.cl.splice(i,1);f=0}else if(a==='addo'){A.o.push({c:'ot',n:''});f=0}else if(a==='rmo'){A.o.splice(i,1);f=0}
else if(a==='ed'){S.step=+b.dataset.s;if(b.dataset.u)S.sub=+b.dataset.u}
else if(a==='an'){if(!S.consent||S.busy)return;S.busy=true;f=0;setTimeout(()=>{S.busy=false;S.step=4;render(1)},700)}else if(a==='dback'){S.step=3}
render(f)});
const rdF=fl=>new Promise(res=>{if(!['image/jpeg','image/png','image/webp'].includes(fl.type))return res('e_type');if(fl.size>10485760)return res('e_size');const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>res(r.result);im.onerror=()=>res('e_dec');im.src=r.result};r.onerror=()=>res('e_dec');r.readAsDataURL(fl)});
$('#f').addEventListener('change',async e=>{let fs=[...e.target.files];e.target.value='';if(!fs.length)return;S.pe='';const rep=S.rep;S.rep=null;
if(rep!=null)fs=fs.slice(0,1);else{const room=3-S.photos.length;if(fs.length>room){S.pe='e_max';fs=fs.slice(0,room)}}
for(const fl of fs){const x=await rdF(fl);if(x.startsWith('data:')){if(rep!=null)S.photos[rep]=x;else S.photos.push(x)}else S.pe=x}
render()});
document.querySelectorAll('[data-l]').forEach(b=>b.addEventListener('click',()=>{S.lang=b.dataset.l;try{localStorage.setItem('sc_lang',S.lang)}catch(x){}render()}));
addEventListener('pagehide',stop);render();
</script></body></html>
